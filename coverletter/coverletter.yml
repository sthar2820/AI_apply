  body: |
    I am writing to express my strong interest in the Full Stack Software Developer III position at Intelliswift Software. My experience in building and scaling full-stack applications using Python, Flask, React, PostgreSQL, and Redis aligns directly with the technical requirements of this role and your commitment to agile, end-to-end product ownership.

    In previous roles, I have a proven record of shipping production-grade software for thousands of users. At Alfred, I led sprint planning and delivered 43 production commits in React and TypeScript, while at Clamphook, I architected a Flask and Redis microservices platform to support over 5,000 concurrent learners. In both positions, I focused on creating resilient REST APIs, implementing CI/CD with Docker, and ensuring high availability in Linux environments. My commitment to quality is demonstrated by my experience in troubleshooting production issues and establishing rigorous, Git-driven workflows.

    As a leader, evidenced by my roles as GDSC President and an ICPC State Champion, I am dedicated to fostering collaborative environments and improving team velocity through clear documentation and best practices. I am confident my technical skills and leadership experience will enable me to contribute significantly to Intelliswift's success.

    I look forward to discussing my qualifications further. Please feel free to contact me at +1-318-750-6383 or myagdichhantyal@gmail.com.
