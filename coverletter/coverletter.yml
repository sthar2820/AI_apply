# BUSINESS COVER LETTER FORMATTING RULES:
# Follow this exact pattern and structure:
# IMPORTANT: Do not use dashes (-) or em-dashes (—) in sentences. Use periods, commas, or restructure sentences instead.
#
# [Date] - Required: Date submitted
# [Your street address] - Required: Your street address, city, state and zip
# [Your phone number with area code]
# [Your e-mail address]
#
# [Name, title, name of business] - Name, title, name of business, street address, city, state, and zip code
# [Street address]
# [City, state, and zip code]
#
# [Greeting with a colon:] - Greeting with a colon:
#
# [Opening paragraph] - Opening paragraph that contains the position, name of company, and banger to sell yourself so that they keep reading
#
# [One or more body paragraphs] - One or more body paragraphs. Refer to your résumé and elaborate on it
#
# [Conclusion] - Conclusion. Should express your appreciation. Request an interview. Include phone number with area code and e-mail address.
#
# [Closing with a comma] - Closing with a comma
#
# sign: Dinesh Chhantyal
#
# [Typed name]

